name: E2E Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: lexcore
          POSTGRES_PASSWORD: lexcore
          POSTGRES_DB: lexcore_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://lexcore:lexcore@localhost:5432/lexcore_test
      SECRET_KEY: ci-secret-key-not-for-production
      ENVIRONMENT: test
      ALLOW_DEV_ENDPOINTS: "true"
      NEXTAUTH_SECRET: ci-nextauth-secret
      NEXTAUTH_URL: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:8000
      INTERNAL_API_URL: http://localhost:8000
      E2E_EMAIL: e2e.test@lexcore.dev
      E2E_PASSWORD: TestLex2026!

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Seed E2E user
        working-directory: backend
        run: |
          python -c "
          import uuid
          from app.core.database import SessionLocal
          from app.models.studio import Studio
          from app.models.user import User, UserRole, AuthProvider
          from app.core.auth import hash_password
          db = SessionLocal()
          studio = Studio(id=str(uuid.uuid4()), name='E2E Studio', slug='e2e-studio')
          db.add(studio)
          db.flush()
          user = User(
            id=str(uuid.uuid4()),
            tenant_id=studio.id,
            email='e2e.test@lexcore.dev',
            full_name='E2E Test',
            hashed_password=hash_password('TestLex2026!'),
            role=UserRole.admin,
            auth_provider=AuthProvider.email,
          )
          db.add(user)
          db.commit()
          print('E2E user created')
          db.close()
          "

      - name: Start backend
        working-directory: backend
        run: uvicorn app.main:app --host 0.0.0.0 --port 8000 &

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:8000/health && break || sleep 2
          done

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start frontend
        working-directory: frontend
        run: npm start -- -p 3001 &

      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:3001 && break || sleep 2
          done

      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test --project=chromium --timeout=60000

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 7

      - name: Upload playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
